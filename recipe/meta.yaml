{% set name = "kernels-data" %}
{% set version = "0.16.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|replace('-', '_') }}-{{ version }}.tar.gz
  sha256: a4dae006305a572122ae8550a224b678d747ffaba431dff8a3f21817271e7148

build:
  number: 0
  skip: true  # [py<310]
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    # Generate a THIRDPARTY license bundle for the vendored Rust crates.
    - cargo-bundle-licenses --format yaml --output ${SRC_DIR}/THIRDPARTY.yml  # [unix]
    - cargo-bundle-licenses --format yaml --output %SRC_DIR%\THIRDPARTY.yml  # [win]

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1.0,<2.0
  run:
    - python

test:
  imports:
    - kernels_data
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
  requires:
    - pip

about:
  home: https://github.com/huggingface/kernels
  summary: Kernels data structures (Python bindings)
  description: |
    kernels-data provides the data structures used by the Hugging Face
    kernels library, exposed to Python via Rust bindings (pyo3). It is a
    low-level support package that is not intended to be used directly.
  license: Apache-2.0
  license_family: Apache
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  doc_url: https://github.com/huggingface/kernels
  dev_url: https://github.com/huggingface/kernels

extra:
  recipe-maintainers:
    - xkong-anaconda
